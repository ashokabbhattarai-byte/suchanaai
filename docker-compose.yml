services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_AI_URL: ${NEXT_PUBLIC_AI_URL}
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID}
        NEXT_PUBLIC_POSTHOG_KEY: ${NEXT_PUBLIC_POSTHOG_KEY}
        NEXT_PUBLIC_POSTHOG_HOST: ${NEXT_PUBLIC_POSTHOG_HOST}

    ports:
      - "127.0.0.1:3535:3535"

    env_file:
      - /opt/config/pnm/web.env

    environment:
      NODE_ENV: production
      PORT: 3535
      HOSTNAME: 0.0.0.0

    mem_limit: 300m

    depends_on:
      api:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3535/api/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile

    env_file:
      - /opt/config/pnm/api.env

    environment:
      NODE_ENV: production
      PORT: 3001
      HOSTNAME: 0.0.0.0
      AI_SERVICE_URL: http://ai:8000

    ports:
      - "127.0.0.1:3001:3001"

    mem_limit: 350m

    depends_on:
      ai:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3001/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

    restart: unless-stopped

  ai:
    build:
      context: .
      dockerfile: apps/ai/Dockerfile

    env_file:
      - /opt/config/pnm/ai.env

    environment:
      ENVIRONMENT: production
      PORT: 8000
      HOSTNAME: 0.0.0.0
      UPLOAD_DIR: /app/data/uploads
      API_INTERNAL_URL: http://api:3001

    ports:
      - "127.0.0.1:8000:8000"

    volumes:
      - ai-models:/app/models
      - ai-data:/app/data

    # multilingual-e5-base is 278M params in fp32 (~1.1 GB of weights), so the
    # previous 700m limit could not fit the model at all — the load was killed
    # (exit 137) the moment the download finished.
    mem_limit: 2g

    # The image ships neither curl nor wget, so probe with the stdlib.
    # start_period is long because the first boot downloads ~1 GB from
    # HuggingFace into the ai-models volume; /health answers "warming" until
    # that completes, and only reports "ok" once the model is resident.
    # Reduced from 900s to 600s: healthcheck should start failing faster if warmup hangs.
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request, json; data=json.load(urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)); exit(0 if data.get('status') in ('ok','warming') else 1)
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 600s

    restart: unless-stopped

volumes:
  ai-models:
  ai-data: