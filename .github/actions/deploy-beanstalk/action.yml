name: Deploy image to Elastic Beanstalk
description: >
  Points a single-container Docker Elastic Beanstalk environment at an
  already-built, already-pushed ECR image via a generated Dockerrun.aws.json.
  Beanstalk never builds anything itself here — it only runs the image
  build-push-ecr already produced.

inputs:
  application-name:
    required: true
  environment-name:
    required: true
  aws-region:
    required: true
  image-uri:
    description: Output of the build-push-ecr action (registry/repo:tag)
    required: true
  container-port:
    required: true
  version-label:
    description: Unique label for this deploy, shown in the Beanstalk console's version history
    required: true
  nginx-proxy-timeout:
    description: >
      Seconds Beanstalk's nginx will wait for the container before returning
      504. Beanstalk's default is 60s, which is fine for a web request but not
      for work measured in minutes — scraping a source or embedding a batch
      both exceed it, and the caller sees "status code 504" with no clue that
      a proxy, not the app, gave up. Leave unset to keep the default.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Write Dockerrun.aws.json
      shell: bash
      run: |
        cat > Dockerrun.aws.json <<EOF
        {
          "AWSEBDockerrunVersion": "1",
          "Image": {
            "Name": "${{ inputs.image-uri }}",
            "Update": "true"
          },
          "Ports": [{ "ContainerPort": "${{ inputs.container-port }}" }]
        }
        EOF

        # .platform/nginx/conf.d/*.conf is merged into Beanstalk's own nginx
        # config at deploy time, which is the only supported way to raise the
        # proxy timeout on the Docker platform.
        TIMEOUT="${{ inputs.nginx-proxy-timeout }}"
        if [ -n "$TIMEOUT" ]; then
          mkdir -p .platform/nginx/conf.d
          cat > .platform/nginx/conf.d/proxy_timeout.conf <<EOF
        proxy_connect_timeout ${TIMEOUT}s;
        proxy_send_timeout    ${TIMEOUT}s;
        proxy_read_timeout    ${TIMEOUT}s;
        EOF
          echo "nginx proxy timeout set to ${TIMEOUT}s"
          zip -r deploy.zip Dockerrun.aws.json .platform
        else
          zip deploy.zip Dockerrun.aws.json
        fi

    # Beanstalk rejects a deploy outright — 400 InvalidParameterValue,
    # "Environment ... is in an invalid state for this operation. Must be
    # Ready." — whenever the environment is mid-change: a previous deploy, an
    # instance replacement, or a console/CLI configuration update (e.g.
    # changing environment properties or the root volume size). The deploy
    # step below only waits for recovery *after* it has started, so without
    # this the job dies in seconds on a race it could simply have waited out.
    #
    # Credentials come from the OIDC step inside build-push-ecr, which runs
    # earlier in the same job and exports them to the job environment.
    - name: Wait for environment to be Ready
      shell: bash
      run: |
        status=unknown
        for attempt in $(seq 1 80); do
          status=$(aws elasticbeanstalk describe-environments \
            --application-name "${{ inputs.application-name }}" \
            --environment-names "${{ inputs.environment-name }}" \
            --region "${{ inputs.aws-region }}" \
            --query "Environments[0].Status" --output text 2>/dev/null || echo "Unknown")
          if [ "$status" = "Ready" ]; then
            echo "Environment is Ready (after $attempt check(s))."
            exit 0
          fi
          echo "Environment status is '$status' — waiting 15s ($attempt/80)…"
          sleep 15
        done
        echo "::error::${{ inputs.environment-name }} never reached Ready within 20 minutes (last status: $status)."
        exit 1

    - name: Deploy
      uses: einaregilsson/beanstalk-deploy@v22
      with:
        # This action only reads credentials from these inputs when run as a
        # GitHub Action — unlike its CLI mode, it does NOT fall back to the
        # ambient AWS_ACCESS_KEY_ID/AWS_SECRET_ACCESS_KEY env vars that
        # build-push-ecr's OIDC step already exported via GITHUB_ENV, so they
        # have to be forwarded explicitly here.
        aws_access_key: ${{ env.AWS_ACCESS_KEY_ID }}
        aws_secret_key: ${{ env.AWS_SECRET_ACCESS_KEY }}
        aws_session_token: ${{ env.AWS_SESSION_TOKEN }}
        application_name: ${{ inputs.application-name }}
        environment_name: ${{ inputs.environment-name }}
        region: ${{ inputs.aws-region }}
        version_label: ${{ inputs.version-label }}
        deployment_package: deploy.zip
        wait_for_environment_recovery: 300
        # version-label is derived from run_number+sha (see ci-cd.yml), so a
        # re-run of the same workflow run reuses the same label. Without
        # this, a retry after a failed deploy always errors with "Version
        # ... already exists" even though nothing about the build changed.
        use_existing_version_if_available: true
