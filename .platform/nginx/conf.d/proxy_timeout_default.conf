# Default proxy timeouts for Elastic Beanstalk nginx (Docker platform).
# EB's default is 60s. Embedding a document (OCR + chunk + embed + Qdrant)
# and scraping a source (crawl + OCR + LLM summarise) both routinely exceed
# 60s and were killed with 504 before this override.
#
# This file ships in the repo so the fix applies even when the deploy action
# is called without an explicit nginx-proxy-timeout input (currently deploy-api
# in ci-cd.yml passes no timeout, while deploy-ai passes 600). When the action
# does generate a per-deploy proxy_timeout.conf, it deletes this file first —
# nginx errors on duplicate directives across conf.d files in the same
# context (it does NOT last-wins merge them), so only one of the two may
# exist in a given deploy.zip.

proxy_connect_timeout 300s;
proxy_send_timeout    300s;
proxy_read_timeout    300s;
# Large uploads (up to client_max_body_size) need the body to be fully read.
# send_timeout is the window nginx waits between two write ops to the client;
# keep it aligned so a slow client/upload doesn't get a 408 while the proxy
# is still forwarding to the container.
send_timeout 300s;
