# Fix 413 Content Too Large on api.suchanaai.tech
# Elastic Beanstalk's Docker platform nginx defaults to client_max_body_size 1M.
# POST /documents with a 5.4 MB PDF (Content-Length 5621219) was rejected by
# nginx with 413 before reaching Node (api, NestJS/Multer limit 20 MB) or
# Python (ai, 100 MB). This file is merged into EB's nginx config at deploy
# time via .platform/nginx/conf.d/*.conf.
#
# 100M covers the API's MAX_FILE_SIZE_MB=100 ceiling and the MAX plan's
# 100 MB uploads plus the AI service's 100 MB ceiling (see
# .github/actions/deploy-beanstalk/action.yml inputs nginx-client-max-body-size).
# The deploy action overrides this to 100M at build time by default; this file
# is the fallback for local/zip deploys.
# client_body_buffer_size keeps small bodies in memory instead of temp files.

client_max_body_size 100M;
client_body_buffer_size 16k;
